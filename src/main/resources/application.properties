server.address=${INIDMS_SERVER_ADDRESS:127.0.0.1}
server.port=${INIDMS_SERVER_PORT:8080}

spring.datasource.url=${INIDMS_DB_URL:jdbc:mysql://127.0.0.1:3306/inidms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${INIDMS_DB_USERNAME:inidms_user}
spring.datasource.password=${INIDMS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
